[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upwork-demand-analysis"
version = "0.3.0"
description = "Terminal-based market intelligence for Upwork — skills heatmap, BD shift optimizer, and n8n automation demand analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rajat" }]
keywords = ["upwork", "freelance", "market-intelligence", "n8n", "automation"]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "pytz>=2024.1",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
upwork-intel = "main:main"

[tool.setuptools]
# We're keeping a flat layout (top-level modules) for now. When the
# codebase grows past ~30 modules, switch to src/ layout.
py-modules = ["main", "config", "auth", "db", "fetcher", "seed"]

[tool.setuptools.packages.find]
include = ["core*", "taxonomies*", "features*"]
exclude = ["tests*", "exports*", "build*", "dist*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "exports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line too long (handled by formatter / tables need it)
    "N806",  # variable name in function should be lowercase (single-letter row vars)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
