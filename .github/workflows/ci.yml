name: CI

on:
  push:
    branches: [main]
  pull_request:  # every base branch, so stacked phase PRs get checks too

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest tests/ -v --tb=short

  smoke-cli:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: CLI help works
        run: |
          python main.py --help
          python main.py n8n --help
          python main.py dashboard --help
          python main.py fetch --help
          python main.py probe --help

      - name: Seed + sync + analyze + offline probe (no API needed)
        env:
          UPWORK_EXPORTS_DIR: /tmp/exports
        run: |
          python main.py seed 7
          python main.py sync --offline
          python main.py n8n 7 -n
          python main.py skills 7
          python main.py dashboard 7
          python main.py purge --dry-run
          python main.py install-service --dry-run
          python main.py probe --offline --out /tmp/api_probe.json
          test -f /tmp/exports/status.json
          python main.py ingest --agent-dir /nonexistent
          python main.py outcome 900000000000000001 submitted --bid 45 --bid-type hourly --connects 12
          python main.py outcome 900000000000000001 hired
          python main.py outcomes
          python main.py funnel 30
