# Every constant that shapes a score lives here and is echoed on the screens it
# shapes. Change a number, bump `version`, and every header and Excel summary
# tells the reader which formula produced what they are looking at.
version = "2026.09.1"

# ── Personal opportunity score (per job, 0–100) ─────────────────────────────
# total = Σ weight × normalised component × 100. Weights sum to 1.
[weights]
win_probability = 0.35   # shrunk win rate of the job's client segment (your funnel)
expected_value  = 0.25   # budget vs cap, scaled by the duration factor
hire_rate       = 0.15   # client's hires ÷ posted jobs (0.5 when unknown)
freshness       = 0.10   # half-life decay since publication
competition     = 0.10   # 1 / (1 + applicants / competition_scale)
fit             = 0.05   # overlap with your portfolio terms (0.5 when no file)

[normalizers]
hourly_rate_cap            = 100.0   # $/hr that scores 1.0
fixed_amount_cap           = 5000.0  # fixed $ that scores 1.0
unknown_budget_score       = 0.1     # any stated budget ≥ $10/hr beats 'unspecified'
competition_scale          = 15.0    # applicants at which competition halves
freshness_half_life_hours  = 24.0
win_probability_cap        = 0.5     # a 50% win rate scores 1.0
neutral_hire_rate          = 0.5
neutral_fit                = 0.5

[normalizers.duration_factor]
"Less than 1 month"  = 0.6
"1 to 3 months"      = 1.0
"3 to 6 months"      = 1.3
"More than 6 months" = 1.6
"" = 1.0

# Until your funnel holds five submissions in a segment, these priors stand in
# for the segment's win rate. They are deliberately modest.
[segment_priors]
champion = 0.15
active   = 0.12
new      = 0.10
risky    = 0.05

[thresholds]
champion_spend          = 10000
champion_hires          = 5
min_segment_submissions = 5
min_band_sample         = 8      # cells below this roll up to the workflow band

# ── Skills lens (per skill, 0–100) ──────────────────────────────────────────
[skills]
demand_weight      = 0.45
budget_weight      = 0.30
competition_weight = 0.25
competition_scale  = 10.0

[caps]
skills           = 50
opportunities    = 12
matrix_industries = 8
matrix_workflows  = 6
stacks           = 20

[connects]
price_usd            = 0.15
default_per_proposal = 12
